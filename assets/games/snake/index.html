<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rắn Săn Mồi</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0b0e14; color: #e8ecf4;
    font-family: "Segoe UI", system-ui, sans-serif;
    gap: 12px; touch-action: manipulation;
  }
  h1 { margin: 0; font-size: 1.2rem; letter-spacing: .05em; }
  #hud { display: flex; gap: 24px; font-size: .95rem; color: #94a0b8; }
  #hud b { color: #22d3ee; }
  canvas {
    background: #10141f; border: 1px solid #232c40; border-radius: 10px;
    max-width: 92vmin; max-height: 60vh;
  }
  #msg { min-height: 1.4em; color: #b7a7ff; font-weight: 600; }
  button {
    background: linear-gradient(90deg, #7c5cff, #22d3ee); color: #fff;
    border: 0; padding: 9px 22px; border-radius: 8px; font-weight: 700;
    cursor: pointer; font-size: .9rem;
  }
  .hint { color: #94a0b8; font-size: .8rem; }
</style>
</head>
<body>
  <h1>🐍 Rắn Săn Mồi</h1>
  <div id="hud">Điểm: <b id="score">0</b> <span>Kỷ lục: <b id="best">0</b></span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="msg"></div>
  <button id="restart">Chơi lại</button>
  <p class="hint">Phím mũi tên / WASD để di chuyển</p>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var GRID = 20, CELL = canvas.width / GRID;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var msgEl = document.getElementById('msg');

  var snake, dir, nextDir, food, score, dead, timer;
  var best = parseInt(localStorage.getItem('snake-best') || '0', 10);
  bestEl.textContent = best;

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; dead = false;
    scoreEl.textContent = '0';
    msgEl.textContent = '';
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, 110);
  }

  function gameOver() {
    dead = true;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake-best', best);
      bestEl.textContent = best;
      msgEl.textContent = '🏆 Kỷ lục mới!';
    } else {
      msgEl.textContent = 'Thua rồi! Bấm "Chơi lại".';
    }
  }

  function tick() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // đâm tường hoặc cắn thân
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      draw();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
      // tăng tốc nhẹ theo điểm
      if (timer && 110 - score * 2 >= 60) {
        clearInterval(timer);
        timer = setInterval(tick, 110 - score * 2);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // lưới mờ
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    // mồi
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    // rắn
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#22d3ee' : 'rgba(34, 197, 94, ' + (1 - i / (snake.length + 6)) + ')';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
    if (dead) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
    }
  }

  // điều khiển
  var keys = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
  };
  document.addEventListener('keydown', function (e) {
    var k = keys[e.key] || keys[e.key.toLowerCase && e.key.toLowerCase()];
    if (!k) return;
    e.preventDefault();
    // không cho quay đầu 180°
    if (k.x === -dir.x && k.y === -dir.y) return;
    nextDir = k;
  });

  document.getElementById('restart').addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
